{{- if and .Values.dashboards.enabled .Values.dashboards.goServiceHealth.enabled }}
{{ $name := printf "%s-go-service-health-dashboard" .Release.Namespace }}
{{ $uid :=  $name | sha1sum }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    {{- include "monitoring-extras.dashboardLabels" . | nindent 4 }}
  name: {{ $name | quote }}
data:
  {{ $name }}.json: |
    {{- $.Files.Get "dashboards/go-service-health.json" | replace "\"uid\": \"$uid\"" (printf "\"uid\": \"%s\"" $uid) | nindent 4 }}
{{- end }}
